<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>L'Effervescence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Effervescence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F9F6F0">
  <!-- No start_url in this file on purpose: on iPhone it would replace your personal link. -->
  <link rel="manifest" href="manifest.webmanifest" id="manifest-link">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #app { position: fixed; top: 0; left: 0; right: 0; bottom: env(safe-area-inset-bottom); width: 100%; border: 0; display: block; }
    #app[hidden] { display: none; }
  #needs-link { display: none; min-height: 100%; box-sizing: border-box; padding: 32px; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #F9F6F0; color: #1A1A1A; }
    #needs-link h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; margin: 0 0 12px; }
    #needs-link p { max-width: 320px; line-height: 1.5; margin: 0; color: #4a4a4a; }
  </style>
</head>
<body>
  <iframe id="app" title="L'Effervescence" hidden></iframe>

  <div id="needs-link">
    <h1>Open your personal link</h1>
    <p>This app opens from the personal link Serena or Liz sent you. Open that link once, then add it to your home screen.</p>
  </div>

  <script>
    (function () {
      // 1. Paste your Apps Script web app address here (Deploy > Manage deployments > Web app URL).
      var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzGNQgr9JGRdLlIrTg72Im3wOeNl5kU8IhqlTP6tcK4rqIbmPWylT8DDipQciiVqR6EAA/exec';

      var STORAGE_KEY = 'effervescence.code';
      var ALLOWED_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/;

      function cleanCode(c) {
        c = String(c || '').trim().toLowerCase();
        return /^[a-z0-9]{6,20}$/.test(c) ? c : '';
      }

      var code = cleanCode(new URLSearchParams(location.search).get('r'));
      try {
        if (code) localStorage.setItem(STORAGE_KEY, code);
        else code = cleanCode(localStorage.getItem(STORAGE_KEY));
      } catch (e) { /* storage unavailable: the link in the address is enough */ }

      var frame = document.getElementById('app');
      var needs = document.getElementById('needs-link');

      if (!code || /YOUR_DEPLOYMENT_ID/.test(EXEC_URL)) {
        needs.style.display = 'flex';
        return;
      }

      // 2. Android: give Chrome a manifest whose start_url is this exact personal link,
      //    so the installed app always opens as the right person.
      try {
        var abs = function (p) { return new URL(p, location.href).href; };
        var manifest = {
          name: "L'Effervescence",
          short_name: 'Effervescence',
          display: 'standalone',
          background_color: '#F9F6F0',
          theme_color: '#F9F6F0',
          start_url: location.href,
          icons: [
            { src: abs('icon-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: abs('maskable-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ]
        };
        var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
      } catch (e) { /* the static manifest stays in place */ }

      frame.src = EXEC_URL + '?r=' + encodeURIComponent(code);
      frame.hidden = false;

      // 3. The app tells us which colour the strip under its tab bar should be.
      window.addEventListener('message', function (ev) {
        if (!ALLOWED_ORIGIN.test(ev.origin)) return;
        var d = ev.data;
        if (!d || d.wf !== 'bg' || !/^#[0-9a-fA-F]{6}$/.test(d.c || '')) return;
        document.documentElement.style.background = d.c;
        document.body.style.background = d.c;
      });
    })();
  </script>
</body>
</html>
