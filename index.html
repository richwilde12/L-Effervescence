<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>L'Effervescence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Effervescence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F9F6F0">
  
  <link rel="manifest" href="manifest.webmanifest" id="manifest-link">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: calc(100% - env(safe-area-inset-bottom, 0px)); border: 0; display: block; }
    #app[hidden] { display: none; }
  #needs-link { display: none; min-height: 100%; box-sizing: border-box; padding: 32px; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #F9F6F0; color: #1A1A1A; }
    #needs-link h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; margin: 0 0 12px; }
    #needs-link p { max-width: 320px; line-height: 1.5; margin: 0; color: #4a4a4a; }
  </style>
</head>
<body>
  <iframe id="app" title="L'Effervescence" hidden></iframe>

  <div id="needs-link">
    <h1>Almost set up</h1>
    <p>Open this file on GitHub and paste your Apps Script deployment ID into the <code>EXEC_URL</code> line near the top of the script. Then reload.</p>
  </div>

  <script>
    (function () {
      // Paste your Apps Script deployment ID in place of YOUR_DEPLOYMENT_ID (the long string between /s/ and /exec in the web app URL).
      var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzGNQgr9JGRdLlIrTg72Im3wOeNl5kU8IhqlTP6tcK4rqIbmPWylT8DDipQciiVqR6EAA/exec';

      var NAME_KEY = 'effervescence.name';
      var ALLOWED_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/;

      var name = '';
      try {
        var n = localStorage.getItem(NAME_KEY);
        if (n === 'Serena' || n === 'Liz') name = n;
      } catch (e) { /* storage unavailable: the app will ask again */ }

      var frame = document.getElementById('app');
      var needs = document.getElementById('needs-link');

      if (/YOUR_DEPLOYMENT_ID/.test(EXEC_URL)) {
        needs.style.display = 'flex';
        return;
      }

      frame.src = EXEC_URL + (name ? '?wn=' + encodeURIComponent(name) : '');
      frame.hidden = false;

      // The app tells us which colour the strip under its tab bar should be.
      window.addEventListener('message', function (ev) {
        if (!ALLOWED_ORIGIN.test(ev.origin)) return;
        var d = ev.data;
        if (!d) return;
        if (d.wf === 'id') {
          // The app says who this phone is. Only the two known names are kept; an empty value never wipes a saved one.
          if (d.n === 'Serena' || d.n === 'Liz') { try { localStorage.setItem(NAME_KEY, d.n); } catch (e) { /* non-fatal */ } }
          return;
        }
        if (d.wf !== 'bg' || !/^#[0-9a-fA-F]{6}$/.test(d.c || '')) return;
        document.documentElement.style.background = d.c;
        document.body.style.background = d.c;
      });
    })();
  </script>
</body>
</html>
